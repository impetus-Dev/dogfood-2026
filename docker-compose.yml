services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dogfood
      POSTGRES_USER: dogfood
      POSTGRES_PASSWORD: dogfood_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogfood"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://dogfood:dogfood_dev_only@db:5432/dogfood
    command: ["./entrypoint.sh"]

volumes:
  pgdata:
